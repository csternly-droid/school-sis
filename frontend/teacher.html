<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Teacher Portal - School SIS</title>
<link rel="manifest" href="manifest-teacher.json">
<meta name="theme-color" content="#1565C0">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SCO">
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; margin: 0; background: #f4f6f8; color: #222; }
  header { background: #1e3a5f; color: white; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 20px; }
  #logoutBtn { background: #ff6b6b; border: none; color: white; padding: 8px 14px; border-radius: 4px; cursor: pointer; }
  .container { max-width: 700px; margin: 40px auto; padding: 0 16px; }
  .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin-bottom: 20px; }
  input, select { padding: 8px; margin: 4px 0; width: 100%; border: 1px solid #ccc; border-radius: 4px; }
  button { background: #1e3a5f; color: white; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; margin-top: 8px; }
  button:hover { opacity: 0.9; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #eee; }
  .error { color: #c0392b; margin-top: 8px; }
  .success { color: #27ae60; margin-top: 8px; }
  .hidden { display: none; }
  form { display: flex; flex-direction: column; gap: 4px; max-width: 400px; }
</style>
</head>
<body>

<!-- ===== LOGIN SCREEN ===== -->
<div id="loginScreen" class="container">
  <div class="card">
    <h1>Teacher Login</h1>
    <form id="loginForm">
      <label>School ID</label>
      <input type="number" id="loginSchoolId" required>
      <label>Serial Number (username)</label>
      <input type="text" id="loginSerial" required>
      <label>Password</label>
      <input type="password" id="loginPassword" required>
      <button type="submit">Log In</button>
    </form>
    <div id="loginError" class="error"></div>
  </div>
</div>

<!-- ===== FORCED PASSWORD RESET ===== -->
<div id="resetScreen" class="container hidden">
  <div class="card">
    <h1>Set a New Password</h1>
    <p>This is your first login. Please set a new password only you know.</p>
    <form id="resetForm">
      <label>New Password</label>
      <input type="password" id="newPassword" required minlength="4">
      <button type="submit">Save New Password</button>
    </form>
    <div id="resetMsg" class="error"></div>
  </div>
</div>

<!-- ===== DASHBOARD ===== -->
<div id="dashboard" class="container hidden">
  <header style="margin: -40px -16px 20px -16px; border-radius: 0;">
    <h1>Teacher Portal</h1>
    <button id="logoutBtn" onclick="logout()">Log Out</button>
  </header>

  <div class="card">
    <h2>Enter Marks</h2>
    <p>Choose your subject/class, then an open exam session.</p>
    <select id="assignmentSelect"></select>
    <select id="examSelect"></select>
    <button onclick="loadMarksEntry()">Load Learners</button>
    <div id="marksMsg"></div>
  </div>

  <div class="card" id="marksCard" style="display:none;">
    <h3 id="marksHeader"></h3>
    <table id="marksTable">
      <thead><tr><th>Name</th><th>Admission #</th><th>Score</th><th>Comment</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script>
const API_BASE = 'https://school-sis-fawn.vercel.app';

function saveToken(token) { localStorage.setItem('sis_teacher_token', token); }
function getToken() { return localStorage.getItem('sis_teacher_token'); }
function clearToken() { localStorage.removeItem('sis_teacher_token'); }
let savedSchoolId = null;

async function api(path, options = {}) {
  const headers = options.headers || {};
  headers['Content-Type'] = 'application/json';
  const token = getToken();
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch(API_BASE + path, { ...options, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (data.error === 'SCHOOL_DEACTIVATED') {
      clearToken();
      alert('This school has been deactivated by the system administrator. You have been logged out.');
      location.reload();
    }
    throw new Error(data.error || 'Request failed');
  }
  return data;
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const school_id = Number(document.getElementById('loginSchoolId').value);
  const serial_number = document.getElementById('loginSerial').value;
  const password = document.getElementById('loginPassword').value;
  const errorBox = document.getElementById('loginError');
  errorBox.textContent = '';
  try {
    const data = await api('/api/login/teacher', {
      method: 'POST',
      body: JSON.stringify({ school_id, serial_number, password })
    });
    saveToken(data.token);
    savedSchoolId = school_id;
    if (data.must_reset_password) {
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('resetScreen').classList.remove('hidden');
    } else {
      showDashboard();
    }
  } catch (err) {
    errorBox.textContent = err.message;
  }
});

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const new_password = document.getElementById('newPassword').value;
  const msg = document.getElementById('resetMsg');
  try {
    await api('/api/teacher/reset-password', { method: 'POST', body: JSON.stringify({ new_password }) });
    document.getElementById('resetScreen').classList.add('hidden');
    showDashboard();
  } catch (err) {
    msg.textContent = err.message;
  }
});

let sessionCheckInterval = null;
function showDashboard() {
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('resetScreen').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  loadAssignments();
  loadExamSessions();
if (sessionCheckInterval) clearInterval(sessionCheckInterval);
  sessionCheckInterval = setInterval(() => { api('/api/session-check').catch(() => {}); }, 20000);
  resetInactivityTimer();
}

function logout() {
  clearToken();
  clearTimeout(inactivityTimer);
  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('resetScreen').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
}

// ====== AUTO LOGOUT AFTER 30 MINUTES OF INACTIVITY ======
const INACTIVITY_LIMIT_MS = 30 * 60 * 1000;
let inactivityTimer = null;

function resetInactivityTimer() {
  if (!getToken()) return;
  clearTimeout(inactivityTimer);
  inactivityTimer = setTimeout(() => {
    logout();
    alert('You have been logged out after 30 minutes of inactivity. Please log in again.');
  }, INACTIVITY_LIMIT_MS);
}

['mousemove', 'keydown', 'click', 'scroll', 'touchstart'].forEach(evt => {
  document.addEventListener(evt, resetInactivityTimer);
});

if (getToken()) showDashboard();

let myAssignments = [];
async function loadAssignments() {
  try {
    myAssignments = await api('/api/teacher-assignments/mine');
    const select = document.getElementById('assignmentSelect');
    select.innerHTML = myAssignments.map((a, i) =>
      `<option value="${i}">${a.subject_name} - ${a.stream_name} (Grade ${a.grade})</option>`
    ).join('');
    if (!myAssignments.length) {
      document.getElementById('marksMsg').innerHTML = '<div class="error">You have no subjects assigned yet. Ask your admin to assign you a subject and class.</div>';
    }
  } catch (err) {
    document.getElementById('marksMsg').innerHTML = `<div class="error">${err.message}</div>`;
  }
}

async function loadExamSessions() {
  try {
    const exams = await api('/api/exam-sessions');
    const select = document.getElementById('examSelect');
    select.innerHTML = exams.map(ex => `<option value="${ex.id}">${ex.name}${ex.is_open ? ' (OPEN)' : ' (closed)'}</option>`).join('');
  } catch (err) {
    document.getElementById('marksMsg').innerHTML = `<div class="error">${err.message}</div>`;
  }
}

async function loadMarksEntry() {
  const idx = document.getElementById('assignmentSelect').value;
  const examId = document.getElementById('examSelect').value;
  const msg = document.getElementById('marksMsg');
  if (idx === '' || !examId) { msg.innerHTML = '<div class="error">Choose a subject/class and exam session.</div>'; return; }
  const assignment = myAssignments[idx];
  try {
    const learners = await api(`/api/classes/${assignment.class_id}/list`);
    const marksheet = await api(`/api/marksheet/${assignment.class_id}/${examId}`);
    const subjIndex = marksheet.subjects.findIndex(s => s.id === assignment.subject_id);

    document.getElementById('marksHeader').textContent =
      `${assignment.subject_name} - ${assignment.stream_name}`;
    const tbody = document.querySelector('#marksTable tbody');
    tbody.innerHTML = '';
    marksheet.rows.forEach(row => {
      const score = subjIndex >= 0 ? row.scores[subjIndex] : null;
      const comment = subjIndex >= 0 && row.comments ? row.comments[subjIndex] : '';
      tbody.innerHTML += `<tr>
        <td>${row.learner.name}</td>
        <td>${row.learner.admission_number}</td>
        <td><input type="number" id="score-${row.learner.id}" value="${score === null ? '' : score}" min="1" max="99"
            onchange="submitMarkRow(${row.learner.id}, ${assignment.subject_id}, ${examId})"></td>
        <td><input type="text" id="comment-${row.learner.id}" value="${comment || ''}" placeholder="Optional comment"
            onchange="submitMarkRow(${row.learner.id}, ${assignment.subject_id}, ${examId})"></td>
      </tr>`;
    });
    document.getElementById('marksCard').style.display = 'block';
    msg.innerHTML = '';
  } catch (err) {
    msg.innerHTML = `<div class="error">${err.message}</div>`;
  }
}

async function submitMarkRow(learnerId, subjectId, examId) {
  const scoreInput = document.getElementById(`score-${learnerId}`);
  const commentInput = document.getElementById(`comment-${learnerId}`);
  const value = scoreInput.value;
  const comment = commentInput.value;
  if (value === '') return;
  try {
    await api('/api/marks', {
      method: 'POST',
      body: JSON.stringify({
        exam_session_id: Number(examId),
        learner_id: learnerId,
        subject_id: subjectId,
        score: Number(value),
        comment: comment
      })
    });
    document.getElementById('marksMsg').innerHTML = '<div class="success">Saved.</div>';
  } catch (err) {
    document.getElementById('marksMsg').innerHTML = `<div class="error">${err.message}</div>`;
  }
}
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
